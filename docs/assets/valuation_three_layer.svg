<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="680" height="380" fill="#fbfdff"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1a2b4a" text-anchor="middle">估值系统三层分工（计算核心只有 basket_valuation 一个函数）</text>
  <!-- Static entry -->
  <rect x="40" y="60" width="270" height="64" rx="10" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="175" y="86" font-size="14" font-weight="700" fill="#1a2b4a" text-anchor="middle">static_valuation.py</text>
  <text x="175" y="108" font-size="12" fill="#3a4a63" text-anchor="middle">静态估值入口（T-1 基准）</text>
  <!-- Dynamic entry -->
  <rect x="370" y="60" width="270" height="64" rx="10" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="505" y="86" font-size="14" font-weight="700" fill="#1a2b4a" text-anchor="middle">dynamic_valuation.py</text>
  <text x="505" y="108" font-size="12" fill="#3a4a63" text-anchor="middle">实时估值入口（盘中）</text>
  <!-- Data engine -->
  <rect x="175" y="170" width="330" height="70" rx="10" fill="#eafaf1" stroke="#2e9e6b" stroke-width="1.5"/>
  <text x="340" y="196" font-size="14" font-weight="700" fill="#13402a" text-anchor="middle">valuation_data_engine.py 数据引擎</text>
  <text x="340" y="218" font-size="12" fill="#2a5a42" text-anchor="middle">读 yaml 映射表 → 装配 components + hedge</text>
  <!-- Core -->
  <rect x="205" y="290" width="270" height="64" rx="10" fill="#fff4e5" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="340" y="316" font-size="14" font-weight="700" fill="#6b3d05" text-anchor="middle">basket_valuation() 计算核心</text>
  <text x="340" y="338" font-size="12" fill="#7a4a10" text-anchor="middle">唯一公式：魔法 / 矩阵（自动分支）</text>
  <!-- Collection layer note -->
  <rect x="520" y="175" width="150" height="60" rx="8" fill="#f3f4f8" stroke="#9aa3b2" stroke-dasharray="5 4" stroke-width="1.2"/>
  <text x="595" y="198" font-size="12" font-weight="700" fill="#4a5263" text-anchor="middle">数据采集层</text>
  <text x="595" y="218" font-size="10.5" fill="#6a7283" text-anchor="middle">woody/IB/新浪/TDX</text>
  <text x="595" y="233" font-size="10.5" fill="#6a7283" text-anchor="middle">只取数，不碰公式</text>
  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5a6478"/></marker>
  </defs>
  <line x1="175" y1="124" x2="300" y2="170" stroke="#5a6478" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="505" y1="124" x2="380" y2="170" stroke="#5a6478" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="340" y1="240" x2="340" y2="290" stroke="#5a6478" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="520" y1="205" x2="505" y2="205" stroke="#9aa3b2" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="300" y="255" font-size="11" fill="#5a6478" text-anchor="middle">注入 {symbol: 现价}</text>
</svg>
