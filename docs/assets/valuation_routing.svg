<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="30" font-size="18" font-weight="700" fill="#1a2b4a" text-anchor="middle">basket_valuation 怎么"知道"用哪个公式？（分流在它外面决定）</text>
  <!-- Step 2 outer: data engine reads yaml -->
  <rect x="30" y="55" width="300" height="80" rx="10" fill="#eafaf1" stroke="#2e9e6b" stroke-width="1.5"/>
  <text x="180" y="80" font-size="13" font-weight="700" fill="#13402a" text-anchor="middle">第②步（函数外·数据引擎）</text>
  <text x="180" y="102" font-size="11.5" fill="#2a5a42" text-anchor="middle">读 yaml 映射表：按 category / valuation_method /</text>
  <text x="180" y="120" font-size="11.5" fill="#2a5a42" text-anchor="middle">valuation_portfolio 决定喂哪些 components + hedge</text>
  <!-- into core -->
  <rect x="360" y="55" width="290" height="80" rx="10" fill="#fff4e5" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="505" y="80" font-size="13" font-weight="700" fill="#6b3d05" text-anchor="middle">basket_valuation(nav, pos,</text>
  <text x="505" y="100" font-size="12" fill="#7a4a10" text-anchor="middle">components, fx_base, fx_now, hedge)</text>
  <text x="505" y="120" font-size="11" fill="#7a4a10" text-anchor="middle">它不收基金代码/日期/静动态标志</text>
  <!-- diamond -->
  <polygon points="505,170 575,205 505,240 435,205" fill="#eef1f7" stroke="#5a6478" stroke-width="1.5"/>
  <text x="505" y="200" font-size="11" font-weight="700" fill="#1a2b4a" text-anchor="middle">hedge&gt;0</text>
  <text x="505" y="216" font-size="11" font-weight="700" fill="#1a2b4a" text-anchor="middle">且单组件?</text>
  <!-- magic -->
  <rect x="120" y="300" width="200" height="64" rx="10" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="220" y="326" font-size="13" font-weight="700" fill="#1a2b4a" text-anchor="middle">魔法公式（O(1)）</text>
  <text x="220" y="348" font-size="11" fill="#3a4a63" text-anchor="middle">162411 / 161125实时 / 513000实时</text>
  <!-- matrix -->
  <rect x="390" y="300" width="200" height="64" rx="10" fill="#f3f4f8" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="490" y="326" font-size="13" font-weight="700" fill="#1a2b4a" text-anchor="middle">矩阵公式（加权）</text>
  <text x="490" y="348" font-size="11" fill="#3a4a63" text-anchor="middle">黄金原油 / 指数 / 静态禁hedge</text>
  <!-- arrows -->
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5a6478"/></marker>
  </defs>
  <line x1="330" y1="95" x2="360" y2="95" stroke="#5a6478" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="505" y1="135" x2="505" y2="170" stroke="#5a6478" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="460" y1="240" x2="300" y2="300" stroke="#5a6478" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="550" y1="240" x2="490" y2="300" stroke="#5a6478" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="350" y="270" font-size="11" fill="#2e9e6b" text-anchor="middle">是</text>
  <text x="600" y="270" font-size="11" fill="#9aa3b2" text-anchor="middle">否</text>
</svg>
